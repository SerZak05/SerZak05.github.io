---
---
{% assign page_title = page.title | default: "Contest" %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title | escape }}</title>
    <link rel="stylesheet" href="{{ '/30kaggle/src/contest.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <h1>{{ page_title | escape }}</h1>
      <p class="archive-link">
        <a href="{{ '/30kaggle/' | relative_url }}">All contests</a>
      </p>
    </header>
    <main id="content">
      <article class="contest-statement" id="contest-statement" hidden>
        {{ content }}
      </article>
      <section
        id="contest-app"
        class="contest-app"
        data-contest-id="{{ page.contest_id | escape }}"
        data-registry-url="{{ '/30kaggle/contests.json' | relative_url }}"
        aria-busy="true"
      >
        <p>Loading contest status.</p>
        <noscript><p>Problems and standings need JavaScript. Problems stay hidden until the contest has started.</p></noscript>
      </section>
    </main>
    <footer class="site-footer">
      <p>Захаров Сергей, 2026</p>
    </footer>
    <script src="{{ '/30kaggle/src/contest.js' | relative_url }}"></script>
  </body>
</html>
