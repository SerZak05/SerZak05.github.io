<!doctype html>
<html lang="{{ site.lang | default: 'ru-RU' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/30kaggle/src/site.css' | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <header
        data-registry-url="{{ '/30kaggle/contests.json' | relative_url }}"
      >
        <h1 class="site-brand">
          <a href="{{ '/30kaggle/' | relative_url }}">30kaggle</a>
        </h1>
        <p>{{ site.description }}</p>
        <nav class="contest-nav" aria-label="Контесты">
          <ul id="contest-sidebar" class="contest-list" aria-busy="true">
            <li>Загрузка контестов.</li>
          </ul>
        </nav>
      </header>
      <section>
        {% unless page.path == "30kaggle/index.md" %}
        <p class="home-link">
          <a href="{{ '/30kaggle/' | relative_url }}">На главную</a>
        </p>
        {% endunless %}
        {{ content }}
      </section>
      <footer>
        <p>Захаров Сергей, 2026</p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
    <script src="{{ '/30kaggle/src/site.js' | relative_url }}"></script>
  </body>
</html>
